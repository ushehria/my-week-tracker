<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Week">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f7f86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>My Week</title>
<style>
  :root {
    --bg: #f7f8f8;
    --card: #ffffff;
    --ink: #111;
    --muted: #5b6366;
    --line: #e2e6e7;
    --ac: #2f7f86;
    --yes: #1f7a4d;
    --yes-bg: #e6f6ee;
    --no: #b42318;
    --no-bg: #fdeceb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(247,248,248,.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px 10px;
    padding-top: max(14px, env(safe-area-inset-top));
  }
  h1 { margin: 0; font-size: 22px; }
  .sub, .sync { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .days {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 0;
    -webkit-overflow-scrolling: touch;
  }
  header .days { padding-left: 0; padding-right: 0; gap: 4px; }
  header .days button { flex: 1 1 0; min-width: 0; padding: 6px 0; }
  .days button {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 14px;
    padding: 6px 10px;
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    display: grid;
    justify-items: center;
    line-height: 1.1;
    min-width: 46px;
  }
  .days .dom { font-size: 12px; font-weight: 600; color: var(--muted); }
  .days button.active .dom { color: #fff; }
  .days button.today:not(.active) { box-shadow: inset 0 0 0 2px var(--ac); }
  .days button.active {
    background: var(--ac);
    border-color: var(--ac);
    color: #fff;
  }
  main { padding: 8px 16px 160px; }
  section, .activity { scroll-margin-top: 168px; scroll-margin-bottom: 96px; }
  .day-heading { margin: 12px 0 0; font-size: 20px; }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-top: 12px;
    overflow: hidden;
  }
  section h2 {
    margin: 0;
    padding: 12px 14px 8px;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ac);
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    width: 100%;
    background: transparent;
    border-left: 0; border-right: 0; border-bottom: 0;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .row.static { cursor: default; }
  .mark {
    width: 44px; height: 44px; flex: none;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    display: grid; place-items: center;
    font-size: 18px; font-weight: 700;
    background: #f3f5f5;
    color: #9aa3a6;
  }
  .mark.yes { background: var(--yes-bg); color: var(--yes); border-color: #b9e4cb; }
  .mark.no { background: var(--no-bg); color: var(--no); border-color: #f3c0bb; }
  .label { flex: 1; font-weight: 600; }
  .time, .note, .hint { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .hint { margin: 0; padding: 0 14px 8px; }
  .activity { padding: 8px 14px 14px; display: grid; gap: 10px; border-top: 1px solid var(--line); }
  .window-title { font-weight: 700; }
  .window-title .time { font-weight: 600; color: var(--ac); }
  .fields { padding: 8px 14px 14px; display: grid; gap: 10px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  input, textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    font: inherit;
    color: var(--ink);
    background: #fff;
  }
  .actions { display: grid; gap: 8px; padding: 0 14px 14px; }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 14px;
    font: inherit;
    font-weight: 700;
    background: var(--ac);
    color: #fff;
  }
  .btn.secondary { background: #e8eeee; color: var(--ink); }
  .saved {
    color: var(--muted);
    font-size: 12px;
    padding: 8px 16px 0;
    text-align: center;
  }
  #summaryBox {
    white-space: pre-wrap;
    background: #f3f5f5;
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    margin: 0;
  }
  footer-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(247,248,248,.96);
    border-top: 1px solid var(--line);
    padding: 8px 10px max(10px, env(safe-area-inset-bottom));
    display: flex; gap: 6px;
  }
  footer-bar .days { flex: 1; width: 100%; padding: 0; }
  footer-bar .days button {
    flex: 1 1 0;
    min-width: 0;
    padding: 8px 0;
    border-radius: 12px;
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1 id="title">My Week</h1>
  <p class="sub" id="sub">Saves on this phone.</p>
  <div id="sync"></div>
  <div class="days" id="dayTop"></div>
</header>
<p class="saved" id="savedMsg">Saved on this phone</p>
<main id="app"></main>
<footer-bar><div class="days" id="dayBottom"></div></footer-bar>
<script type="module" src="./app.js"></script>
</body>
</html>
